<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>希朝音乐盒模拟器</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/src/style.css">
</head>

<body data-background-theme="night">
    <div class="app-scene">
        <div class="sprite-side left" role="button" tabindex="0" data-background-theme="night"
            aria-label="切换到夜空背景" title="切换到夜空背景"> <img src="/sprites/xixi-piano.gif"
                alt="Piano boy singer animation" /> </div> <!-- 包含显示面板与钢琴键盘的统一外层容器 -->
        <div class="piano-app-wrapper">
            <div id="display-board">
                <div class="title-controls-row">
                    <div class="song-picker-title" title="选择曲谱">
                        <div id="titleContainer" class="song-title-main"> 希朝音乐盒模拟器 </div>
                        <select id="songSelect" aria-label="选择曲谱">
                            <option value="">请选择曲谱</option>
                        </select>
                    </div>
                    <div id="keyPickerTitle" class="key-picker-title" hidden title="选择调式">
                        <span id="keyTitleText">C 调</span>
                        <select id="keySelect" disabled aria-label="选择调式">
                            <option value="">选择调式</option>
                        </select>
                    </div>
                </div>
                <div id="subTitleContainer" class="song-title-sub"></div> <!-- 曲谱选择与图形化控制按钮内嵌在显示面板中 -->
                <div id="controls"> <button id="playPauseBtn" disabled title="播放"> ▶ </button> <button id="practiceBtn"
                        class="toggle-btn" disabled title="练习模式"> ✋ </button> <button id="muteToggleBtn"
                        class="toggle-btn" disabled title="静音"> 🔊 </button> <button id="instrumentToggleBtn"
                        class="toggle-btn" title="切换音色"> 🎶 </button> <button id="hideControlsBtn"
                        class="inline-triangle-toggle" title="隐藏控制"> ▴ </button> </div> <!-- 始终显示 Expanded View 完整曲谱 -->
                <div id="fullSheetContainer" class="full-sheet-container">
                    <div class="full-sheet-line">
                        <div class="full-lyrics"> 请选择一首曲谱开始 </div>
                        <div class="full-notes"></div>
                    </div>
                </div>
                <div id="practiceCompleteMessage" class="practice-complete-message" hidden>练习完成，太棒啦！</div>
            </div> <!-- 钢琴键盘外层滚动容器（内部键盘将自动居中对齐） -->
            <div class="piano-container">
                <div class="piano" id="keyboard"></div>
            </div>
        </div>
        <div class="sprite-side right" role="button" tabindex="0" data-background-theme="dawn"
            aria-label="切换到日出背景" title="切换到日出背景"> <img src="/sprites/zhaozhao-violin.gif"
                alt="Black-haired boy singer" /> </div>
    </div>
    <div class="info-popover">
        <button id="infoToggleBtn" class="info-toggle" type="button" aria-expanded="false"
            aria-controls="infoPanel" title="使用说明">ⓘ</button>
        <section id="infoPanel" class="info-panel" aria-label="使用说明" hidden>
            <p>欢迎来到希朝音乐盒 🎶 这里可以选择喜欢的歌曲，跟着曲谱听旋律、练习弹奏，也可以切换白天和夜晚的小小像素天空。</p>
            <div class="info-grid">
                <span>🎵 歌名：选择歌曲</span>
                <span>调式：切换歌曲调式</span>
                <span>▶️ 播放 / 暂停</span>
                <span>✋ 跟着高亮音符练习</span>
                <span>🔊 / 🔇 开启或关闭声音</span>
                <span>🎶 / 🎹 / 🎻 切换音色</span>
                <span>▴ / ▾ 隐藏或显示控制</span>
                <span>🌙 点击希希切换夜晚</span>
                <span>🌅 点击朝朝切换日出</span>
            </div>
        </section>
    </div>
    <footer class="credits">制作by 来财来 · <a href="mailto:mxhcpstories@yahoo.com">点击联系</a></footer>
    <script type="module" src="/src/main.js"></script>
</body>

</html>
